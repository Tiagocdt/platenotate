name: Build PlateNotate

# Builds a double-clickable app for macOS, Windows and Linux and — on a version tag —
# publishes them as a GitHub RELEASE. The release is the point: Actions artifacts expire
# after 90 days and need a GitHub login, so they are useless as a download link for a
# colleague. Release assets are permanent and public.
on:
  workflow_dispatch:          # run manually from the Actions tab
  push:
    tags: ["v*"]              # …or on a version tag (v1.2.0)

permissions:
  contents: write             # needed to create the release

# NOTE: this workflow expects the repo to contain packaging/_deps/ (the vendored sibling
# modules — commit them via `python packaging/gather_deps.py`).
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgirepository1.0-dev gir1.2-webkit2-4.1 \
                                  python3-gi python3-gi-cairo gir1.2-gtk-3.0
      - name: Install deps
        run: python -m pip install -r requirements-desktop.txt pyinstaller
      - name: Build
        run: python -m PyInstaller --noconfirm --clean packaging/notate.spec

      # ---- smoke test: the frozen app must actually boot and serve the UI ----
      # A bundle that builds but dies on launch is worse than no bundle at all, so the
      # server is started headless out of the SAME frozen tree that ships.
      - name: Smoke test (macOS/Linux)
        if: runner.os != 'Windows'
        timeout-minutes: 8
        shell: bash
        run: |
          exe=$(ls dist/PlateNotate.app/Contents/MacOS/PlateNotate 2>/dev/null || ls dist/PlateNotate/PlateNotate)
          set +e; "$exe" --selftest; rc=$?; set -e
          [ -f platenotate-selftest.log ] && cat platenotate-selftest.log
          exit $rc
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 8
        # A windowed .exe neither blocks PowerShell nor has a usable stdout, and on a
        # headless runner a PyInstaller crash dialog would wait forever for a click. So:
        # start it, wait a BOUNDED time, kill it if it hangs, and judge by the log file
        # the app writes itself. A hang fails the step instead of stalling the job.
        run: |
          $p = Start-Process -FilePath dist\PlateNotate\PlateNotate.exe `
                             -ArgumentList '--selftest' -PassThru
          if (-not $p.WaitForExit(240000)) {
            Write-Host "::error::selftest did not exit within 240s — killing it"
            try { $p.Kill() } catch {}
            if (Test-Path platenotate-selftest.log) { Get-Content platenotate-selftest.log }
            exit 1
          }
          if (Test-Path platenotate-selftest.log) {
            Get-Content platenotate-selftest.log
            if ((Get-Content platenotate-selftest.log -Raw) -match 'selftest: PASS') { exit 0 }
            Write-Host "::error::selftest reported a failure (see the log above)"
            exit 1
          }
          Write-Host "::error::the app produced no selftest log (exit code $($p.ExitCode))"
          exit 1

      # ---- the GUI LAUNCH path, headless ----
      # --selftest exits long before the window is created, so it never touched the
      # banner/launch code — which is precisely where the Windows build died on a
      # cp1252 console. This runs the real launch, stopping just short of the window.
      - name: Launch test (macOS/Linux)
        if: runner.os != 'Windows'
        timeout-minutes: 5
        shell: bash
        env:
          PLATENOTATE_NO_GUI: "1"
        run: |
          exe=$(ls dist/PlateNotate.app/Contents/MacOS/PlateNotate 2>/dev/null || ls dist/PlateNotate/PlateNotate)
          "$exe"
      - name: Launch test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        env:
          PLATENOTATE_NO_GUI: "1"
        # chcp 1252 forces the console encoding that broke it, so a regression fails HERE.
        run: |
          chcp 1252 | Out-Null
          $p = Start-Process -FilePath dist\PlateNotate\PlateNotate.exe -PassThru
          if (-not $p.WaitForExit(180000)) {
            Write-Host "::error::the app did not finish its launch path within 180s"
            try { $p.Kill() } catch {}
            exit 1
          }
          if ($p.ExitCode -ne 0) {
            Write-Host "::error::the app crashed on launch (exit $($p.ExitCode))"
            exit 1
          }
          Write-Host "launch path OK"

      # ---- the GUI TOOLKIT itself ----
      # The launch test above stops one call short of webview.start(), so the toolkit
      # behind the window was never loaded by anything in CI — and loading it is exactly
      # what failed on a collaborator's Windows machine (pywebview -> pythonnet ->
      # Python.Runtime.dll -> .NET said no). A headless runner cannot check that a window
      # RENDERS; it can absolutely check that the toolkit will load, which is the failure
      # that shipped.
      - name: GUI backend probe (Windows, marked as downloaded)
        if: runner.os == 'Windows'
        timeout-minutes: 6
        # Reproduce the collaborator's machine first. A .zip fetched with a browser and
        # extracted by Explorer leaves EVERY extracted file carrying a Zone.Identifier
        # stream, and the .NET Framework refuses to load an assembly that has one. A
        # runner that builds its own files locally never sees that mark, which is why a
        # green build shipped an app that could not open its window.
        run: |
          $files = @(Get-ChildItem -Path dist\PlateNotate -Recurse -File |
                     Where-Object { $_.Extension -in '.dll', '.pyd', '.exe' })
          foreach ($f in $files) {
            Set-Content -Path $f.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          Write-Host "marked $($files.Count) files as downloaded-from-the-internet"
          if ($files.Count -eq 0) {
            Write-Host "::error::marked nothing - this test would not be testing anything"
            exit 1
          }
          # Prove the mark took, so a silently-ignored Set-Content cannot make the probe
          # look like it survived a condition it never met.
          $probe = Get-Content -Path $files[0].FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue
          if (-not $probe) {
            Write-Host "::error::the Zone.Identifier stream did not stick on $($files[0].Name)"
            exit 1
          }
          $p = Start-Process -FilePath dist\PlateNotate\PlateNotate.exe `
                             -ArgumentList '--gui-probe' -PassThru
          if (-not $p.WaitForExit(300000)) {
            Write-Host "::error::the GUI probe did not finish within 300s"
            try { $p.Kill() } catch {}
            exit 1
          }
          if (Test-Path platenotate-guiprobe.log) { Get-Content platenotate-guiprobe.log }
          if ($p.ExitCode -ne 0) {
            Write-Host "::error::the Windows GUI backend will not load (see above)"
            exit 1
          }
      - name: GUI backend probe (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 6
        shell: bash
        run: dist/PlateNotate.app/Contents/MacOS/PlateNotate --gui-probe
      - name: GUI backend probe (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 6
        shell: bash
        # Reported, not required. The GTK bindings pywebview needs on Linux come from the
        # runner's SYSTEM python (apt installs python3-gi), not from the build venv, so a
        # failure here measures the runner as much as the bundle — and since v1.5.0 the
        # app opens in the browser rather than dying when the toolkit is missing.
        continue-on-error: true
        run: dist/PlateNotate/PlateNotate --gui-probe

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip -qry PlateNotate-macOS.zip PlateNotate.app
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/PlateNotate/* -DestinationPath dist/PlateNotate-Windows.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cd dist && tar czf PlateNotate-Linux.tar.gz PlateNotate

      - uses: actions/upload-artifact@v4
        with:
          name: PlateNotate-${{ runner.os }}
          path: |
            dist/PlateNotate-*.zip
            dist/PlateNotate-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    # always(): publish whatever DID build. One platform failing must not withhold the
    # working builds from everyone else — a missing asset is obvious in the release,
    # while no release at all just looks like the project is dead.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: List what will be published
        run: |
          ls -la downloads/
          if [ -z "$(ls -A downloads/ 2>/dev/null)" ]; then
            echo "::error::no build succeeded — nothing to release"; exit 1
          fi
          for os in macOS Windows Linux; do
            ls downloads/ | grep -q "$os" \
              || echo "::warning::no $os build in this release (that platform failed)"
          done
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: downloads/*
          name: PlateNotate ${{ github.ref_name }}
          body: |
            **Download the app for your computer, unzip it, and double-click it.**
            No Python, no terminal, nothing to install.

            | Your computer | Download | First launch |
            |---|---|---|
            | macOS | `PlateNotate-macOS.zip` | **Right-click the app → Open**, then confirm |
            | Windows | `PlateNotate-Windows.zip` | Unzip, run `PlateNotate.exe` → "More info" → "Run anyway" |
            | Linux | `PlateNotate-Linux.tar.gz` | Extract, run `./PlateNotate` |

            The app is **not code-signed** (that needs a paid Apple/Microsoft developer
            certificate), so the first launch shows a warning. On macOS you must
            right-click → Open the *first* time — double-clicking a downloaded unsigned
            app just refuses, with no way through from that dialog. If it is still
            blocked, run once:
            `xattr -dr com.apple.quarantine /Applications/PlateNotate.app`

            **Windows:** the app now clears the "downloaded from the internet" mark from
            its own files on startup — that mark is what stopped earlier versions from
            opening their window. If it ever still misbehaves right after a download,
            right-click **the .zip** → Properties → **Unblock** → OK, then extract again.
            And if the window cannot be opened at all, PlateNotate opens in your default
            browser instead of failing.

            Everything stays on your machine: PlateNotate is a local app over your own
            image folders — no account, no upload, no network access.

            See [CHANGELOG.md](https://github.com/Tiagocdt/platenotate/blob/main/CHANGELOG.md)
            for what changed in this version.
